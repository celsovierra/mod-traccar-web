server {
    listen 80;
    listen [::]:80;
    server_name gpscell.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gpscell.site;

    ssl_certificate /etc/letsencrypt/live/gpscell.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpscell.site/privkey.pem;

    client_max_body_size 50M;

    location / { proxy_pass http://127.0.0.1:8082; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/socket { proxy_pass http://127.0.0.1:8082; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    location /api-financeiro/ { proxy_pass http://127.0.0.1:8092/; }
    location /api-contratos/ { proxy_pass http://127.0.0.1:8093/; }
    location /api-device-edit/ { proxy_pass http://127.0.0.1:8090; }
    location /api-anchor/ { proxy_pass http://127.0.0.1:8090; }
    location /api-relay-status/ { proxy_pass http://127.0.0.1:8090; }
    location /api-device-geofence/ { proxy_pass http://127.0.0.1:8090; }
    location /api-device-event/ { proxy_pass http://127.0.0.1:8090; }
    location /api-telegram/ { proxy_pass http://127.0.0.1:8095/; }
    location /api-smsmarket/ { proxy_pass https://api.smsmarket.com.br/webservice-rest/; proxy_ssl_server_name on; }
}